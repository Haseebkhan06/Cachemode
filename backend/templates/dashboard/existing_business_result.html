<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Details Summary</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f4f8f5 0%, #eef6f2 100%);
            color: #18221c;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 100%; max-width: 560px;
            background: white;
            border: 1px solid #e4ebe5;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(27, 48, 36, 0.08);
        }
        h1 { margin-top: 0; }
        .info { margin: 18px 0; padding: 14px 16px; background: #f8fbf9; border-radius: 12px; }
        .label { font-size: 12px; color: #67766f; display: block; margin-bottom: 5px; }
        .value { font-weight: 700; font-size: 18px; }
        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #183d2b;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Business Summary</h1>

            <div class="info">
                <span class="label">Business name</span>
                <span class="value">{{ business_name }}</span>
            </div>

            <div class="info">
                <span class="label">Location</span>
                <span class="value">{{ location }}</span>
            </div>

            <div class="info">
                <span class="label">Investment amount</span>
                <span class="value">₹{{ investment_amount }}</span>
            </div>

            <a href="{% url 'dashboard' %}" class="back">Back to selection</a>
        </div>
    </div>
</body>
</html>
